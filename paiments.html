<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Paiement - EduGest</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <nav class="navbar">

        <div class="logo">
            📚 EduGest
        </div>

        <div class="menu">

            <a href="index.html">
                👨‍🎓 Étudiants
            </a>

            <a href="paiement.html">
                💳 Paiement
            </a>

            <a href="meteo.html">
                🌤️ Météo
            </a>

            <a href="index.html">
                🏠 Accueil
            </a>

        </div>

    </nav>


    <h1>
        💳 Gestion des Paiements
    </h1>


    <div class="form-container">

        <h2>
            Enregistrer un paiement
        </h2>


        <form id="paymentForm">


            <div class="form-group">

                <label for="nomPaiement">
                    Nom de l'étudiant :
                </label>

                <input
                    type="text"
                    id="nomPaiement"
                    placeholder="Ex : Jean Dupont"
                    required
                >

            </div>


            <div class="form-group">

                <label for="montant">
                    Montant :
                </label>

                <input
                    type="number"
                    id="montant"
                    placeholder="Ex : 50000"
                    min="1"
                    required
                >

            </div>


            <div class="form-group">

                <label for="datePaiement">
                    Date du paiement :
                </label>

                <input
                    type="date"
                    id="datePaiement"
                    required
                >

            </div>


            <div class="form-group">

                <label for="modePaiement">
                    Mode de paiement :
                </label>

                <select
                    id="modePaiement"
                    required
                >

                    <option value="">
                        Choisir
                    </option>

                    <option value="Espèces">
                        💵 Espèces
                    </option>

                    <option value="Lumicash">
                        📱 Lumicash
                    </option>

                    <option value="Ecocash">
                        📱 Ecocash
                    </option>

                    <option value="Banque">
                        🏦 Banque
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="motif">
                    Motif :
                </label>

                <select
                    id="motif"
                    required
                >

                    <option value="">
                        Choisir
                    </option>

                    <option value="Frais académiques">
                        Frais académiques
                    </option>

                    <option value="Inscription">
                        Inscription
                    </option>

                    <option value="Examen">
                        Examen
                    </option>

                    <option value="Autre">
                        Autre
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="btn-add"
            >

                💾 Enregistrer le paiement

            </button>


            <button
                type="button"
                id="whatsappPayment"
                class="btn-whatsapp"
            >

                💬 Envoyer sur WhatsApp

            </button>


        </form>

    </div>

</div>


<script src="paiement.js"></script>

</body>
</html>
